name: Publier l'énigme (Short logique / paradoxe)

on:
  schedule:
    - cron: "0 17 * * *"   # chaque jour à 17:00 UTC (modifie cette ligne pour changer l'heure)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test : fabrique le Short SANS le publier"
        type: boolean
        default: true
      topic:
        description: "Sujet imposé (optionnel, format : thème | forme)"
        required: false
      privacy:
        description: "Visibilité du Short publié"
        type: choice
        options: [public, unlisted, private]
        default: public

permissions:
  contents: write
  models: read

concurrency:
  group: publish-enigmes
  cancel-in-progress: false

jobs:
  enigme:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      PRIVACY: ${{ inputs.privacy || 'public' }}
      TOPIC_OVERRIDE: ${{ inputs.topic }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer ffmpeg et polices
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Installer les dépendances Python
        run: pip install -r requirements.txt

      - name: Fabriquer et publier l'énigme
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODELS_TOKEN: ${{ secrets.MODELS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT3_CLIENT_ID: ${{ secrets.YT3_CLIENT_ID }}
          YT3_CLIENT_SECRET: ${{ secrets.YT3_CLIENT_SECRET }}
          YT3_REFRESH_TOKEN: ${{ secrets.YT3_REFRESH_TOKEN }}
        run: python enigmes_pipeline.py

      - name: Garder la vidéo de test
        if: ${{ env.DRY_RUN == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: enigme-test
          path: out/
          retention-days: 3

      - name: Marquer le thème comme publié
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add enigmes_published.txt
          git diff --cached --quiet || (git commit -m "Énigme publiée" && git pull --rebase origin main && git push)
